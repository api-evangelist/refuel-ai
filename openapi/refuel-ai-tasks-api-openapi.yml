openapi: 3.2.0
info:
  title: Fast Tasks API
  version: 0.1.0
tags:
- name: Tasks
paths:
  /tasks:
    get:
      summary: Get Team Tasks
      description: 'Get all tasks for a team.


        Args:

        ----

        token: Authentication token containing team info


        Returns:

        -------

        ResponseModel: List of tasks for the team'
      operationId: get_team_tasks_tasks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel_List_'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
  /tasks/{task_id}:
    get:
      summary: Get Task
      description: 'Get details for a specific task.


        Args:

        ----

        task_id: ID of the task to retrieve

        token: Access token for authentication


        Returns:

        -------

        ResponseModel containing the task details


        Raises:

        ------

        HTTPException: If task not found or unauthorized'
      operationId: get_task_tasks__task_id__get
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
    post:
      summary: Edit Task
      description: 'Edit properties of an existing task.


        Args:

        ----

        task_id: ID of the task to edit

        edits: Dictionary of edits to apply to the task

        clear_labels_and_feedback: Whether to clear existing labels and feedback

        token: Access token for authentication


        Returns:

        -------

        ResponseModel containing the updated task details


        Raises:

        ------

        HTTPException: If task not found, unauthorized, or edits are invalid'
      operationId: edit_task_tasks__task_id__post
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: false
        schema:
          type: boolean
          title: Clear Labels And Feedback
          default: false
        name: clear_labels_and_feedback
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Edits
              default: {}
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
    delete:
      summary: Delete Task
      description: 'Delete a task and all associated resources.


        Args:

        ----

        task_id: ID of the task to delete

        token: Access token for authentication


        Returns:

        -------

        ResponseModel containing success/failure status


        Raises:

        ------

        HTTPException: If task not found, unauthorized, or deletion fails'
      operationId: delete_task_tasks__task_id__delete
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel_ChangeResourceResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
  /tasks/{task_id}/models:
    get:
      summary: Get Task Models
      description: 'Get available models for a task.


        Args:

        ----

        task_id: ID of the task to get models for

        token: Access token for authentication


        Returns:

        -------

        ResponseModel containing list of available and in-progress models


        Raises:

        ------

        HTTPException: If task not found or unauthorized'
      operationId: get_task_models_tasks__task_id__models_get
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
  /tasks/{task_id}/subtasks/{subtask_id}:
    delete:
      summary: Delete Subtask
      description: 'Delete a subtask from a task.


        Args:

        ----

        task_id: ID of the task containing the subtask

        subtask_id: ID of the subtask to delete

        token: Access token for authentication


        Returns:

        -------

        ResponseModel indicating success/failure


        Raises:

        ------

        HTTPException: If task/subtask not found or unauthorized'
      operationId: delete_subtask_tasks__task_id__subtasks__subtask_id__delete
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: true
        schema:
          type: string
          title: Subtask Id
        name: subtask_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
  /tasks/{task_id}/transforms/{transform_id}:
    delete:
      summary: Delete Transform
      description: 'Delete a transform from a task.


        Args:

        ----

        task_id: ID of the task containing the transform

        transform_id: ID of the transform to delete

        token: Access token for authentication


        Returns:

        -------

        ResponseModel indicating success/failure


        Raises:

        ------

        HTTPException: If task/transform not found or unauthorized'
      operationId: delete_transform_tasks__task_id__transforms__transform_id__delete
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: true
        schema:
          type: string
          title: Transform Id
        name: transform_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
  /tasks/{task_id}/datasets/{dataset_id}:
    get:
      summary: Get Items From Task Run
      description: 'Get items from a task run for a specific dataset.


        Args:

        ----

        task_id: ID of the task to get items from

        dataset_id: ID of the dataset to get items from

        eval: Whether to get evaluation set items

        offset: Number of items to skip for pagination

        max_items: Maximum number of items to return

        filters: List of filters to apply to the query

        order_bys: List of order by clauses to apply

        token: Access token for authentication


        Returns:

        -------

        ResponseModel containing the items and metadata


        Raises:

        ------

        HTTPException: If task/dataset not found or unauthorized'
      operationId: get_items_from_task_run_tasks__task_id__datasets__dataset_id__get
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: true
        schema:
          type: string
          title: Dataset Id
        name: dataset_id
        in: path
      - required: false
        schema:
          type: boolean
          title: Eval
          default: false
        name: eval
        in: query
      - required: false
        schema:
          type: integer
          title: Offset
          default: 0
        name: offset
        in: query
      - required: false
        schema:
          type: integer
          title: Max Items
          default: 10
        name: max_items
        in: query
      - required: false
        schema:
          items:
            type: string
          type: array
          title: Filters
        name: filters
        in: query
      - required: false
        schema:
          items:
            type: string
          type: array
          title: Order Bys
        name: order_bys
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
  /tasks/{task_id}/seedset:
    get:
      summary: Get Items From Seedset
      description: 'Get items from a task''s seedset with filtering and pagination.


        Args:

        ----

        task_id: ID of the task to get seedset items from

        offset: Number of items to skip for pagination

        max_items: Maximum number of items to return

        filters: List of filters to apply to the results

        order_bys: List of fields to order results by

        token: Access token for authentication


        Returns:

        -------

        ResponseModel containing the filtered and paginated seedset items


        Raises:

        ------

        HTTPException: If task not found or unauthorized'
      operationId: get_items_from_seedset_tasks__task_id__seedset_get
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: false
        schema:
          type: integer
          title: Offset
          default: 0
        name: offset
        in: query
      - required: false
        schema:
          type: integer
          title: Max Items
          default: 10
        name: max_items
        in: query
      - required: false
        schema:
          items:
            type: string
          type: array
          title: Filters
        name: filters
        in: query
      - required: false
        schema:
          items:
            type: string
          type: array
          title: Order Bys
        name: order_bys
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
  /tasks/{task_id}/evalset:
    get:
      summary: Get Items From Evalset
      description: 'Get items from a task''s evaluation set.


        Args:

        ----

        task_id: ID of the task to get evaluation items from

        model_id: Optional model ID to filter results

        offset: Number of items to skip for pagination

        max_items: Maximum number of items to return

        filters: List of filters to apply to results

        order_bys: List of fields to order results by

        token: Access token for authentication


        Returns:

        -------

        ResponseModel containing evaluation set items with:

        - schema: Dataset schema

        - items: List of evaluation items

        - total_count: Total number of items

        - task/dataset metadata


        Raises:

        ------

        HTTPException: If task not found or unauthorized'
      operationId: get_items_from_evalset_tasks__task_id__evalset_get
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: false
        schema:
          type: string
          title: Model Id
        name: model_id
        in: query
      - required: false
        schema:
          type: integer
          title: Offset
          default: 0
        name: offset
        in: query
      - required: false
        schema:
          type: integer
          title: Max Items
          default: 10
        name: max_items
        in: query
      - required: false
        schema:
          items:
            type: string
          type: array
          title: Filters
        name: filters
        in: query
      - required: false
        schema:
          items:
            type: string
          type: array
          title: Order Bys
        name: order_bys
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
    post:
      summary: Create Evalset
      description: 'Create an evaluation set for a task by sampling items from a dataset.


        Args:

        ----

        task_id: ID of the task to create evalset for

        dataset_id: ID of the dataset to sample from

        sampling_parameters: Parameters for sampling items

        filters: List of filters to apply when sampling

        token: Access token for authentication


        Returns:

        -------

        ResponseModel containing success status


        Raises:

        ------

        HTTPException: If task/dataset not found or unauthorized'
      operationId: create_evalset_tasks__task_id__evalset_post
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: true
        schema:
          type: string
          title: Dataset Id
        name: dataset_id
        in: query
      - required: false
        schema:
          items:
            type: string
          type: array
          title: Filters
        name: filters
        in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SamplingEvent'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel_ChangeResourceResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
  /tasks/{task_id}/runs/{dataset_id}/metrics:
    get:
      summary: Get Metrics For Task Run
      description: 'Get metrics for a specific task run.


        Args:

        ----

        task_id: ID of the task to get metrics for

        dataset_id: ID of the dataset to get metrics for

        filters: List of filters to apply when calculating metrics

        eval: Whether to get metrics for evaluation mode

        token: Access token for authentication


        Returns:

        -------

        ResponseModel containing metrics data


        Raises:

        ------

        HTTPException: If task/dataset not found or unauthorized'
      operationId: get_metrics_for_task_run_tasks__task_id__runs__dataset_id__metrics_get
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: true
        schema:
          type: string
          title: Dataset Id
        name: dataset_id
        in: path
      - required: false
        schema:
          type: boolean
          title: Eval
          default: false
        name: eval
        in: query
      - required: false
        schema:
          items:
            type: string
          type: array
          title: Filters
        name: filters
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
  /tasks/{task_id}/evalset/metrics:
    get:
      summary: Get Evalset Metrics For Task Run
      description: 'Get evaluation metrics for a task''s evaluation set.


        Args:

        ----

        task_id: ID of the task to get metrics for

        filters: Optional list of filters to apply to the evaluation set

        model_id: Optional model ID to filter results by

        token: Access token for authentication


        Returns:

        -------

        ResponseModel containing metrics data with:

        - Mapping of subtask IDs to list of MetricResult objects

        - Each MetricResult contains metric name, value and support count


        Raises:

        ------

        HTTPException: If task not found or unauthorized'
      operationId: get_evalset_metrics_for_task_run_tasks__task_id__evalset_metrics_get
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: false
        schema:
          type: string
          title: Model Id
        name: model_id
        in: query
      - required: false
        schema:
          items:
            type: string
          type: array
          title: Filters
        name: filters
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
  /tasks/{task_id}/runs/{dataset_id}:
    get:
      summary: Get Task Run
      description: 'Get details about a specific task run.


        Args:

        ----

        task_id: ID of the task to get run details for

        dataset_id: ID of the dataset the task was run on

        eval: If True, get evaluation run instead of regular run

        token: Access token for authentication


        Returns:

        -------

        ResponseModel containing the task run details


        Raises:

        ------

        HTTPException: If task/dataset not found or unauthorized'
      operationId: get_task_run_tasks__task_id__runs__dataset_id__get
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: true
        schema:
          type: string
          title: Dataset Id
        name: dataset_id
        in: path
      - required: false
        schema:
          type: boolean
          title: Eval
          default: false
        name: eval
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
    post:
      summary: Update Task Run
      operationId: update_task_run_tasks__task_id__runs__dataset_id__post
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: true
        schema:
          type: string
          title: Dataset Id
        name: dataset_id
        in: path
      - required: false
        schema:
          type: boolean
          title: Cancel Run
          default: false
        name: cancel_run
        in: query
      - required: false
        schema:
          type: integer
          title: Num Items
        name: num_items
        in: query
      - required: false
        schema:
          type: boolean
          title: Eval
          default: false
        name: eval
        in: query
      - required: false
        schema:
          items:
            type: string
          type: array
          title: Filters
        name: filters
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
    delete:
      summary: Clear Task Run
      description: 'Delete a task run and its associated data.


        Args:

        ----

        task_id: ID of the task to clear run for

        dataset_id: ID of the dataset containing the run

        token: Access token for authentication


        Returns:

        -------

        ResponseModel indicating success/failure


        Raises:

        ------

        HTTPException: If task/dataset not found or unauthorized'
      operationId: clear_task_run_tasks__task_id__runs__dataset_id__delete
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: true
        schema:
          type: string
          title: Dataset Id
        name: dataset_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
  /tasks/{task_id}/runs:
    get:
      summary: Get Task Runs
      description: 'Get all task runs for a specific task.


        Args:

        ----

        task_id: ID of the task to get runs for

        token: Access token for authentication


        Returns:

        -------

        ResponseModel containing list of task runs with:

        - id: str - Task run ID

        - project_id: str - Project ID

        - task_id: str - Task ID

        - task_name: str - Task name

        - model_name: str - Model name

        - dataset_id: str - Dataset ID

        - dataset_name: str - Dataset name

        - status: str - Run status

        - is_eval_run: bool - Whether this is an evaluation run

        - created_at: datetime - Creation timestamp

        - updated_at: datetime - Last update timestamp


        Raises:

        ------

        HTTPException: If task not found or unauthorized'
      operationId: get_task_runs_tasks__task_id__runs_get
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
    post:
      summary: Update Task Run V2
      description: 'Update or manage a task run for a specific task.


        Args:

        ----

        task_id: ID of the task to update run for

        dataset_id: Optional ID of dataset to run task on

        cancel_run: Whether to cancel an existing run

        num_items: Number of items to process in run

        filters: List of filters to apply to dataset

        eval: Whether this is an evaluation run

        token: Access token for authentication


        Returns:

        -------

        Response indicating success/failure


        Raises:

        ------

        HTTPException: If task not found or unauthorized'
      operationId: update_task_run_v2_tasks__task_id__runs_post
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: false
        schema:
          type: string
          title: Dataset Id
        name: dataset_id
        in: query
      - required: false
        schema:
          type: boolean
          title: Cancel Run
          default: false
        name: cancel_run
        in: query
      - required: false
        schema:
          type: integer
          title: Num Items
        name: num_items
        in: query
      - required: false
        schema:
          type: boolean
          title: Eval
          default: false
        name: eval
        in: query
      - required: false
        schema:
          items:
            type: string
          type: array
          title: Filters
        name: filters
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Tasks
  /tasks/{task_id}/datasets/{dataset_id}/items/{item_id}/label:
    get:
      summary: Preview Labels V2
      description: 'Preview labels for a specific item in a dataset.


        Args:

        ----

        task_id: ID of the task to preview labels for

        dataset_id: ID of the dataset containing the item

        item_id: ID of the item to preview labels for

        model_id: Optional model ID to use for generating labels

        subtask_id: Optional subtask ID to filter labels for

        token: Access token for authentication

        generate_missing_labels: Whether to generate missing labels

        generate_missing_explanations: Whether to generate missing explanations


        Returns:

        -------

        ResponseModel containing the previewed labels


        Raises:

        ------

        HTTPException: If dataset/task not found or unauthorized'
      operationId: preview_labels_v2_tasks__task_id__datasets__dataset_id__items__item_id__label_get
      parameters:
      - required: true
        schema:
          type: string
          title: Task Id
        name: task_id
        in: path
      - required: true
        schema:
          type: string
          title: Dataset Id
        name: dataset_id
        in: path
      - required: true
        schema:
          type: string
          title: Item Id
        name: item_id
        in: path
      - required: false
        schema:
          type: string
          title: Model Id
        name: model_id
