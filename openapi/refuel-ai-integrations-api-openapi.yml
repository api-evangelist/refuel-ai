openapi: 3.2.0
info:
  title: Fast Integrations API
  version: 0.1.0
tags:
- name: Integrations
paths:
  /integrations:
    get:
      summary: Get Integrations
      operationId: get_integrations_integrations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
      security:
      - HTTPBearer: []
      tags:
      - Integrations
  /integrations/{integration_id}:
    get:
      summary: Get Integration
      operationId: get_integration_integrations__integration_id__get
      parameters:
      - required: true
        schema:
          type: string
          title: Integration Id
        name: integration_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Integrations
    patch:
      summary: Update Integration
      operationId: update_integration_integrations__integration_id__patch
      parameters:
      - required: true
        schema:
          type: string
          title: Integration Id
        name: integration_id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Data
              default: {}
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Integrations
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ResponseModel:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        error_msg:
          type: string
          title: Error Msg
        data:
          title: Data
        count:
          type: integer
          title: Count
      type: object
      title: ResponseModel
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
