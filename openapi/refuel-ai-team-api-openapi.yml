openapi: 3.2.0
info:
  title: Fast Team API
  version: 0.1.0
tags:
- name: Team
paths:
  /team/sign-url:
    get:
      summary: Get Presigned Url
      operationId: get_presigned_url_team_sign_url_get
      parameters:
      - required: true
        schema:
          type: string
          title: Url
        name: url
        in: query
      - required: false
        schema:
          type: integer
          title: Expiration
          default: 60
        name: expiration
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedURLResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Team
  /team:
    get:
      summary: Get Team
      operationId: get_team_team_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel_Dict_'
      security:
      - HTTPBearer: []
      tags:
      - Team
    post:
      summary: Update Team
      operationId: update_team_team_post
      parameters:
      - required: false
        schema:
          type: boolean
          title: Regenerate Api Key
          default: false
        name: regenerate_api_key
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Team
components:
  schemas:
    SignedURLResponse:
      properties:
        url:
          type: string
          title: Url
      type: object
      required:
      - url
      title: SignedURLResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ResponseModel:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        error_msg:
          type: string
          title: Error Msg
        data:
          title: Data
        count:
          type: integer
          title: Count
      type: object
      title: ResponseModel
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ResponseModel_Dict_:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        error_msg:
          type: string
          title: Error Msg
        data:
          type: object
          title: Data
        count:
          type: integer
          title: Count
      type: object
      title: ResponseModel[Dict]
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
