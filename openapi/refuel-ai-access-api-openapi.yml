openapi: 3.2.0
info:
  title: Fast Access API
  version: 0.1.0
tags:
- name: Access
paths:
  /access/llm:
    post:
      summary: Request Llm Access
      operationId: request_llm_access_access_llm_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
      tags:
      - Access
  /access/llm/interactions:
    post:
      summary: Handle Llm Slack Interactions
      description: 'Handles the interaction when an admin clicks on the button

        to approve or reject the access key generation request'
      operationId: handle_llm_slack_interactions_access_llm_interactions_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
      tags:
      - Access
  /access/product:
    post:
      summary: Request Product Access
      operationId: request_product_access_access_product_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
      tags:
      - Access
  /access/product/interactions:
    post:
      summary: Handle Product Slack Interactions
      description: 'Handles the interaction when an admin clicks on the button

        to approve or reject the access key generation request'
      operationId: handle_product_slack_interactions_access_product_interactions_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
      tags:
      - Access
components:
  schemas:
    ResponseModel:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        error_msg:
          type: string
          title: Error Msg
        data:
          title: Data
        count:
          type: integer
          title: Count
      type: object
      title: ResponseModel
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
