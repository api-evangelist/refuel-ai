gaps:
- >-
  No named response schema for any core entity. Project, Dataset, Task, Application, Item
  and Model have no components.schemas entry — every 200 returns ResponseModel with an
  untyped `data` field. A consumer cannot learn an entity's fields from this spec, only its
  routes. This is the single largest contract-quality gap in the Refuel Cloud API.
- >-
  No pagination metadata schema. ResponseModel carries a `count` integer, and read routes
  take offset / max_items / order_bys / filters, but none of that is described as a
  reusable component.
