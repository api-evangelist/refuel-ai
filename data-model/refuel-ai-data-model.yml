- name: FinetunedModel
  description: A model finetuned from a base model on a Task's data (LoRA and augmented finetuning supported).
  operations: [finetune_model_for_task_projects__project_id__finetuned_models_post, get_finetuned_models_for_project_task_projects__project_id__finetuned_models_get, get_finetuned_model_from_id_finetuned_models__model_id__get, update_finetuned_model_finetuned_models__model_id__patch, delete_finetuned_model_from_id_finetuned_models__model_id__delete]
- name: Application
  description: A versioned snapshot of a Task deployed behind a realtime REST label endpoint.
  operations: [get_team_applications_applications_get, get_applications_projects__project_id__applications_get, create_application_projects__project_id__applications_post, get_application_applications__application_id__get, delete_application_applications__application_id__delete, online_label_applications__application_id__label_post, application_feedback_applications__application_id__items__item_id__label_post, get_items_from_application_applications__application_id__items_get, get_application_item_applications__application_id__items__item_id__get, get_application_usage_applications__application_id__usage_get]
- name: Export
  description: An asynchronous export job over a Dataset or a Task tag; created, then downloaded by export_id.
  operations: [export_dataset_datasets__dataset_id__exports_post, download_dataset_datasets__dataset_id__exports__export_id__get, export_task_tasks__task_id___tag__exports_post, download_export_task_tasks__task_id___tag__exports__export_id__get]
- name: Integration
  description: A configured cloud-storage or warehouse connection (S3, GCS, Snowflake, Databricks).
