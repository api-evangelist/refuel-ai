description: >-
  Entity graph of the Refuel Cloud platform, derived from the path hierarchy, path
  parameters and component schemas of the harvested OpenAPI. Refuel's model is a four-level
  spine — Team > Project > Dataset/Task > Application — with Items as the row-level unit and
  Models/Finetuned Models attached to Tasks. The FastAPI-generated spec exposes almost every
  entity through path parameters rather than named response schemas (108 of 108 operations
  return the generic ResponseModel envelope), so relationships below are derived from route
  structure and request bodies, which is where Refuel's real cardinality is visible.
identifiers:
  style: uuid
  note: >-
    All resource ids are UUID strings (project_id, dataset_id, task_id, application_id,
    item_id, model_id, taxonomy_id, calibration_id, export_id, integration_id, user_id).
    No typed/prefixed id scheme. Several routes also accept a human name in place of the id
    — Refuel's own catalog docs call POST /applications/resume-parsing/label, using the
    application name where the spec declares {application_id}.
entities:
- name: Team
  description: The top-level tenant. Owns users, projects, integrations, the API key and the usage quota.
  operations: [get_team_team_get, update_team_team_post, get_teams_teams_get, get_team_usage_usage_get]
  fields: [name, integrations, web_app, llm_config, api_key, api_key_sha, api_usage, created_at, email_domain, feature_flags]
  note: >-
    TeamSchema includes `api_key` and `api_key_sha`. GET /team therefore returns the team's
    own API credential in its response body — an agent granted read access to /team is
    granted the key itself. Recorded as a governance fact, not a vulnerability claim.
- name: User
  description: A member of a Team; lifecycle State is CREATED / INVITED / INVITE_FAILED / ACTIVE.
  operations: [get_users_users_get, invite_users_users_post, get_user_users__user_id__get, update_user_users__user_id__patch, create_user_users__user_email__post, get_authenticated_user_user_get, update_authenticated_user_user_patch]
- name: Project
  description: A logical grouping of datasets, tasks, applications and finetuned models.
  operations: [get_projects_projects_get, create_project_projects_post, get_project_projects__project_id__get, delete_project_projects__project_id__delete]
- name: Dataset
  description: >-
    A collection of rows of structured / semi-structured data. DatasetSource is one of
    databricks, file, s3, snowflake, uri. Ingest is two-step — presigned URL, then ingest.
  operations: [get_datasets_datasets_get, ingest_dataset_datasets_ingest_post, ingest_dataset_v2_projects__project_id__datasets_post, update_dataset_datasets__dataset_id__patch, delete_dataset_datasets__dataset_id__delete, append_dataset_datasets__dataset_id__append_post, sample_dataset_datasets__dataset_id__sample_post]
- name: Item
  description: A single row inside a Dataset, and the unit labels and feedback attach to.
  operations: [get_items_from_dataset_datasets__dataset_id__get, get_item_from_dataset_datasets__dataset_id__items__item_id__get, add_items_to_dataset_datasets__dataset_id__items_post, delete_item_from_dataset_datasets__dataset_id__items__item_id__delete, modify_item_properties_tasks__task_id__datasets__dataset_id__items__item_id__post]
  fields: [in_evalset]
- name: Task
  description: A set of LLM guidelines describing the transformation to run over a Dataset.
  operations: [get_team_tasks_tasks_get, get_tasks_projects__project_id__tasks_get, create_task_projects__project_id__tasks_post, get_task_tasks__task_id__get, edit_task_tasks__task_id__post, delete_task_tasks__task_id__delete]
- name: Subtask
  description: A step inside a chained Task.
  operations: [delete_subtask_tasks__task_id__subtasks__subtask_id__delete]
- name: Transform
  description: A transformation step attached to a Task.
  operations: [delete_transform_tasks__task_id__transforms__transform_id__delete]
