- aid: refuel-ai:refuel-ai-applications-api
  name: Refuel Applications API
  description: >-
    The documented realtime application label surface — the endpoint Refuel's own catalog page
    publishes as `POST https://cloud-api.refuel.ai/applications/{applicationName}/label`, with the
    concrete request shape and the published 300 req/min, 100 concurrent rate limit. This entry
    predates the harvest of the full Refuel Cloud API and describes the same product from the
    documentation rather than the machine-readable contract; the operation it covers appears in
    the Cloud API spec as online_label_applications__application_id__label_post.
