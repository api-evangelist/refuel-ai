aid: refuel-ai
url: https://raw.githubusercontent.com/api-evangelist/refuel-ai/refs/heads/main/apis.yml
name: Refuel
kind: company
description: >-
  Refuel is an AI data-labeling and data-enrichment platform that uses large language models
  to label, clean, structure and enrich enterprise datasets. Refuel Cloud exposes a REST API
  at cloud-api.refuel.ai covering projects, datasets, tasks and task runs, taxonomies,
  seedsets and evalsets, confidence calibration, Refuel LLM-2 finetuning, and deployed
  applications whose realtime label endpoint transforms new rows on demand. The open-source
  autolabel library lets teams run the same LLM labeling workflows in their own environment
  against OpenAI, Anthropic, Google, HuggingFace, vLLM or Refuel-hosted models. Refuel.ai was
  acquired by Together AI in May 2025; the platform continues to operate and its API is still
  live.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
  source:
  - openapi
  - pricing
  generated: '2026-08-28'
  method: derived
accessModel:
  pricing: enterprise
  onboarding: sales
  trial: false
  try_now: false
  public: false
  label: Enterprise
  confidence: high
  source:
  - https://www.refuel.ai/get-started
  - plans/refuel-ai-plans-pricing.yml
  generated: '2026-08-14'
  method: searched
  note: >-
    Corrected from a prior derived read of "freemium / self-serve". https://www.refuel.ai/get-started
    is a sales lead form (First Name, Work Email, Company, "Tell us about your use case",
    "Thanks! We'll be in touch shortly"), not a signup. There is no public pricing page
    (/pricing returns 404) and no self-serve trial. The open-source autolabel library is the
    only freely usable Refuel artifact.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/refuel-ai.png
