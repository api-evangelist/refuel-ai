  properties:
  - url: https://github.com/refuel-ai/autolabel
    type: GitHub
  - url: https://docs.refuel.ai
    type: Documentation
  - url: https://pypi.org/project/refuel-autolabel/
    type: PyPI
  description: >-
    Autolabel is the open-source Python library (pip install refuel-autolabel) to label, clean, and enrich
    text datasets with any LLM (OpenAI, Anthropic, Google, HuggingFace, vLLM, Refuel-hosted). It is a
    local library and SDK, not the hosted Refuel Cloud REST API; it covers classification, NER, entity
    matching, and question answering with few-shot and chain-of-thought prompting. Last PyPI release
    0.0.16 on 2023-10-16; repository last pushed 2025-03-05.
- aid: refuel-ai:refuel-cloud-api
  name: Refuel Cloud API
  description: >-
    The full Refuel Cloud REST API — 108 operations across 77 paths, harvested verbatim from
    https://cloud-api.refuel.ai/openapi.json on 2026-08-14. Covers projects, datasets and items,
    tasks, task runs, seedsets and evalsets, taxonomies, confidence calibration, base and
    finetuned models, deployed applications and their realtime label endpoint, users, teams,
    usage and cloud/warehouse integrations. Authentication is an API key sent as an HTTP Bearer
    token. The spec is FastAPI-generated: it declares no tags and returns a generic
    ResponseModel envelope on every 200, so it names the routes but not the entity shapes.
  humanURL: https://docs.refuel.ai/overview
  baseURL: https://cloud-api.refuel.ai
