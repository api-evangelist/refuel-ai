  email: kin@apievangelist.com
x-enrichment:
  date: '2026-08-14'
  status: enriched
  artifacts_added: 23
  pass: local-v1
x-not-published:
  note: >-
    Recorded so a later round does not re-probe. Refuel publishes none of the following, and
    NO pointer is emitted for any of them.
  pricing:
    probe: https://www.refuel.ai/pricing
    status: 404
    detail: No public pricing page. Refuel Cloud is quoted by sales.
  status_page:
    probes:
    - url: https://status.refuel.ai
      status: NXDOMAIN
    - url: https://refuel.statuspage.io
      status: 200
      detail: Redirects to atlassian.com/software/statuspage — the subdomain is unclaimed, not a Refuel page.
  changelog:
    probes:
    - url: https://www.refuel.ai/changelog
      status: 404
    - url: https://docs.refuel.ai/changelog
      status: 404
  roadmap:
    probe: https://www.refuel.ai/roadmap
    status: 404
  security_txt:
    detail: No /.well-known/security.txt on any Refuel host; see well-known/refuel-ai-well-known.yml.
  idempotency:
    detail: >-
      Zero occurrences of "idempoten" in the 106KB OpenAPI and no mention in the docs, so no
      Idempotency pointer is emitted. See conventions/refuel-ai-conventions.yml.
  asyncapi_webhooks:
    detail: >-
      No AsyncAPI and no outbound webhooks. The only event machinery is two inbound webhook
      receivers; see asyncapi/refuel-ai-events.yml. No AsyncAPI or Webhooks pointer is emitted.
  cli:
    detail: No first-party CLI found in the docs, the GitHub org or any package registry.
  components:
    detail: No embeddable UI components or element libraries published.
  graphql:
    detail: No GraphQL endpoint found on any Refuel host.
  grpc:
    detail: No .proto definitions in the GitHub org, on buf.build, or in the docs.
  oauth_scopes:
    detail: >-
      Auth is a single HTTP Bearer API key with no scope surface, so no scopes/ artifact is
      written. See authentication/refuel-ai-authentication.yml.
