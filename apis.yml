  name: Refuel Autolabel (Open Source)
  tags:
  - Open Source
  - Autolabel
  - Python
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/refuel-ai/autolabel
