- aid: refuel-ai:refuel-autolabel-oss
  name: Refuel Autolabel (Open Source)
  tags:
  - Open-Source
  - Autolabel
  - Python
  tags_raw:
  - Open Source
  - Autolabel
  - Python
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/refuel-ai/autolabel
  baseURL: https://github.com/refuel-ai/autolabel
  properties:
  - url: https://github.com/refuel-ai/autolabel
    type: GitHub
  - url: https://docs.refuel.ai
    type: Documentation
  - url: https://pypi.org/project/refuel-autolabel/
    type: PyPI
  description: >-
    Autolabel is the open-source Python library (pip install refuel-autolabel) to label, clean, and enrich
    text datasets with any LLM (OpenAI, Anthropic, Google, HuggingFace, vLLM, Refuel-hosted). It is a
    local library and SDK, not the hosted Refuel Cloud REST API; it covers classification, NER, entity
    matching, and question answering with few-shot and chain-of-thought prompting. Last PyPI release 0.0.16
    on 2023-10-16; repository last pushed 2025-03-05.
- aid: refuel-ai:refuel-ai-applications-api
  name: Refuel Applications API
  description: >-
    The documented realtime application label surface — the endpoint Refuel's own catalog page publishes
    as `POST https://cloud-api.refuel.ai/applications/{applicationName}/label`, with the concrete request
    shape and the published 300 req/min, 100 concurrent rate limit. This entry predates the harvest of
    the full Refuel Cloud API and describes the same product from the documentation rather than the machine-readable
    contract; the operation it covers appears in the Cloud API spec as online_label_applications__application_id__label_post.
