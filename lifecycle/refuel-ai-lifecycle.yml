assessment: >-
  The API is running and its machine-readable contract is current enough to harvest, but no
  Refuel-controlled surface has changed in roughly fifteen months, the newest first-party
  SDK release predates the acquisition, and there is no status page, changelog, SLA or
  deprecation policy to signal what happens next. Treat Refuel Cloud as a maintained but
  frozen platform inside Together AI, and expect no notice if that changes.
