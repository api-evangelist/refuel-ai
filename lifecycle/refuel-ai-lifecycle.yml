description: >-
  Lifecycle posture of Refuel. The dominant fact is an acquisition: Refuel.ai was acquired
  by Together AI, announced 2025-05-14, with the whole team joining Together and the
  platform stated to "continue to operate as-is for now". As of this probe the Refuel Cloud
  API is still live and still serves a 108-operation OpenAPI, but every dated surface Refuel
  controls — website, docs, SDK releases — stopped moving around the acquisition.
ownership:
