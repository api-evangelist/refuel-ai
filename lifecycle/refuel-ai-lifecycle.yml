  acquirer: Together AI
  announced: '2025-05-14'
  announcement: https://www.refuel.ai/blog-posts/we-are-joining-together-ai
  quote: >-
    "Today, we're thrilled to announce that Refuel.ai has been acquired by Together.ai...
    Our platform will continue to operate as-is for now... Refuel LLM-2 is available on
    Together.ai's platform."
  banner: >-
    Every page of www.refuel.ai carries a site-wide banner reading "Refuel.ai is joining
    Together AI - learn more".
  effect_on_api: >-
    None announced. No sunset date, no migration guide, no deprecation notice on the API or
    in the docs. Customers were told "there's no immediate action required on your part".
