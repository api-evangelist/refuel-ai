description: >-
  Event-surface record for Refuel. There is no AsyncAPI document and no outbound webhook
  catalog. The only event machinery in Refuel's contract is INBOUND — two receiver endpoints
  that let external systems notify Refuel. This file exists so a later round does not re-run
  the same search, and so the inbound-only shape is on the record.
  NO `AsyncAPI` OR `Webhooks` POINTER IS EMITTED IN apis.yml: those types assert that the
  provider publishes an event stream or notifies subscribers, and Refuel does neither.
