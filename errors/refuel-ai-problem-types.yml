  - name: ResponseModel
    schema: '{ "success": <bool>, "error_msg": "<string>", "data": <any>, "count": <int> }'
    used_by: [200]
    note: >-
      The 200 envelope carries `success: false` + `error_msg`, so a soft error can arrive
      with HTTP 200. A client that only checks the status code will read a failed call as a
      success. This is the most important runtime semantic in the Refuel error surface.
  - name: gateway
    schema: '{ "message": "Unauthorized" }'
    used_by: [401]
    note: >-
      Emitted by the edge in front of cloud-api.refuel.ai for any request without a valid
