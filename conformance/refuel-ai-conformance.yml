description: >-
  Standards and compliance posture. Two published certifications (SOC 2, GDPR) carry the
  compliance side; the technical standards side is thin — Refuel ships a valid OpenAPI 3.1.0
  and HTTP Bearer auth and essentially nothing else from the cross-cutting standards shelf.
